services:
  acevo-server-manager:
    # Local build - for testing Dockerfile/entrypoint changes. For normal
    # use, use docker-compose.yml instead (pulls the published image).
    build:
      context: .
      dockerfile: bin/Dockerfile
    container_name: acevo-server-manager
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Uncomment and tune to your host's capacity if Wine + steamcmd need
    # capping (plain compose "mem_limit"/"cpus", not the swarm-only "deploy:"
    # block, which docker compose on a single host ignores):
    # mem_limit: 4g
    # cpus: 2.0
    ports:
      - "8773:8773"       # web UI
      # Must match each server's "Server Options" page in the web UI.
      # `./acsm-evo-control.sh add-server` manages these for you.
      - "9800:9800/udp"     # server 1 (default)
      - "9800:9800/tcp"
      - "9801:9801/tcp"
      # - "9802:9802/udp"   # server 2 - uncomment and match the UI's ports
      # - "9802:9802/tcp"
      # - "9803:9803/tcp"
    volumes:
      # releases/<version>/ - raw .zip (auto-extracted) or pre-extracted
      # linux/. Switch versions via ACEVO_VERSION in .env, no rebuild needed.
      - ./releases/${ACEVO_VERSION:-v1.6.3}:/acevo/vendor-src:ro
      - ./data/config.yml:/acevo/config.yml
      - ./data/ACEVO.License:/acevo/ACEVO.License
      - ./data/server:/acevo/server
      # Despite the name, store.path is a directory the manager manages
      # internally, not a single JSON file.
      - ./data/store.json:/acevo/store.json
